[project]
name = "eis-ai"
version = "0.1.0"
description = "EIS AI — human-like school assistant backend (FastAPI + LangGraph + Gemini)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.12",
  "pyjwt>=2.9",
  "langgraph>=0.2.50",
  "google-genai>=0.8",
  "google-cloud-speech>=2.28",
  "google-cloud-texttospeech>=2.21",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "anyio>=4.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
